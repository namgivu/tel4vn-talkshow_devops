name: ci-stg--vitereactjs_webapp

on:
  push:
    branches: [deploy/stg]
    paths:    [vitereactjs_webapp/**]
  workflow_dispatch:  # allow manual trigger

env:
  # Docker Hub image naming
  IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/vitereactjs_webapp

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04  # why ubuntu 22.04 - safest and most widely compatible runner today

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      #region build docker image
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build image
        run: |
          docker build . -f vitereactjs_webapp/zdocker/Dockerfile \
                         --tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
                         --tag ${{ env.IMAGE_NAME }}:latest
      - name: Push image
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
        #TODO    push ${{ env.IMAGE_NAME }}:${{ github.sha }}  # sothat we can tag 1-2 stable ones
      #endregion build docker image


      - name: Deploy
        run: |
          echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/private_key
          chmod                                                    600 ~/.ssh/private_key
          ssh -o StrictHostKeyChecking=no -i                           ~/.ssh/private_key ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} << EOSSH
            set -e  # halted if err
            set -x  # print the executed cmd
            
            cd xstar-automation 
            b=${{ github.ref_name }}
            git fetch origin $b && git switch -C $b origin/$b
            
            DOCKER_IMAGE_REPO=${{ secrets.DOCKERHUB_USERNAME }} \
            DOCKER_IMAGE_TAG=latest \
            docker compose -f vitereactjs_webapp/zdocker/docker-compose.yml  up -d --build --remove-orphans
            
            docker system prune --volumes -f
          EOSSH

      #TODO - name: Testing w/ curl - wait for the compose up container healthy then curl to its port 8000 make sure succeeded

      #TODO ci to rollback to a stable version
